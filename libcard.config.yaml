# yaml-language-server: $schema=./libcard.schema.json
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  This is the ONLY file you need to edit to make LibCard your own.    │
# │  Change the values below, commit, and push — GitHub Pages rebuilds.  │
# │  To pull in new themes/features later: `pnpm run update` — it leaves │
# │  this file untouched. Full guide: docs/UPGRADING.md                  │
# └─────────────────────────────────────────────────────────────────────┘
#
# John Silva — digital business card. Intended for
# https://johnsilvaeng.github.io/card/ as a companion to the engineering
# portfolio at https://johnsilvaeng.github.io/.

# --- Who you are (the card header) ---
profile:
  name: John Silva
  tagline: I make difficult welds possible
  avatar: /john-silva.jpg # public/john-silva.jpg — the portfolio headshot
  location: Kettering, Northants, UK

# --- Contact details ---
# These power the "Save contact" button (a downloadable vCard) and the QR card.
contact:
  email: john@cwt-group.com
  # Company switchboard, extension 4. This string is never displayed — it only
  # feeds the tel: link and the vCard, so it has to dial correctly:
  #   - no "(0)": with +44 the trunk 0 must be dropped. A dialer that strips the
  #     parens but keeps the 0 would try +4401536… and fail.
  #   - ",,4": each comma is a ~2s pause, then DTMF 4. This is what actually
  #     reaches the extension on iOS and Android; "Ext.4" as text does not dial.
  #   - no spaces: they end up unencoded in the tel: URI, which RFC 3966 forbids.
  #     Browsers tolerate it, but there is no reason to depend on that.
  phone: "+441536412828,,4"
  organization: CWT Group
  title: Technical Director & Co-owner
  website: https://cwt-group.com # the URL saved into the vCard

# --- Social icon row (icon-only, shown above the links) ---
socials:
  - platform: linkedin
    url: https://uk.linkedin.com/in/john-silva-mechanicaleng

# --- Your links (the buttons) ---
links:
  - label: Engineering portfolio
    url: https://johnsilvaeng.github.io/
    icon: globe
  - label: LinkedIn
    url: https://uk.linkedin.com/in/john-silva-mechanicaleng
    icon: linkedin
  - label: CWT Group
    url: https://cwt-group.com
    icon: globe

# --- Rich content blocks (optional, ordered) ---
# Kept to one: tap-to-call and tap-to-email, which is what a card is for.
blocks:
  - type: contact-buttons
    call: true # uses contact.phone above
    email: true # uses contact.email above

# --- Look & feel ---
theme:
  name: silva # custom theme in themes/silva.yaml — matches the portfolio
  switcher: false # off: a personal card should not offer to restyle itself (also keeps it zero-JS)
  animate: false

# --- Footer credit ---
footer:
  poweredBy: true # LibCard is MIT — the credit stays
  themeCredit: false # the theme is John's own (MIT), so the credit would be redundant

# --- SEO / link previews (optional) ---
seo:
  description: John Silva — Technical Director and co-owner at CWT Group. Laser welding, weld metallurgy and ISO 9001 quality systems.

# --- Landscape "card mode" (rotate your phone to flash a business card) ---
cardMode:
  enabled: true # landscape business-card overlay + portrait rotate hint
  qr: page # scan -> opens this card, which carries the Save-contact button
  hint: true # the subtle "⟲ Rotate to show your card" nudge in portrait
  wakeLock: true # keep the screen lit while you hold the card up to someone

# --- Analytics ---
# Deliberately omitted. `getAnalytics()` returns null when this block is absent,
# so the page ships no beacon, no pixel, no cookies and no third-party request.

# --- Where this site lives ---
# base: "/repo-name" for project pages. Getting it wrong breaks every asset.
site:
  url: https://johnsilvaeng.github.io
  base: /card
